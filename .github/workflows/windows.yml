name: Windows

# Builds, tests and packages the unsigned Windows x64 port. Only the Windows port is built here; the
# macOS release stays on Xcode Cloud (docs/releasing.md). A canonical vMAJOR.MINOR.PATCH tag adds a
# DRAFT GitHub release for a maintainer to review and publish by hand. Nothing here ever publishes.

on:
  pull_request:
    paths: ['windows/**', 'spec/**', 'scripts/windows-*.ps1', '.github/workflows/windows.yml', 'project.yml']
  push:
    branches: [main]
    paths: ['windows/**', 'spec/**', 'scripts/windows-*.ps1', '.github/workflows/windows.yml', 'project.yml']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup if the runner image lacks it
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' } }

      - name: Build, test, package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./scripts/windows-release.ps1 -RequireInstaller -ExpectTag $tag

      - name: Verify checksums
        shell: pwsh
        working-directory: windows/artifacts/release
        run: |
          foreach ($line in Get-Content SHA256SUMS-windows.txt) {
            $hash, $name = $line -split '\s+', 2
            if ((Get-FileHash $name -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw "checksum mismatch: $name" }
          }

      - name: Smoke test zip
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Asset (Get-ChildItem windows/artifacts/release/*.zip).FullName

      - name: Smoke test installer
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Asset (Get-ChildItem windows/artifacts/release/*-setup.exe).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: clio-windows-x64
          path: |
            windows/artifacts/release/*.zip
            windows/artifacts/release/*-setup.exe
            windows/artifacts/release/SHA256SUMS-windows.txt
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clio-windows-x64
          path: dist

      - name: Create or extend a DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          # Add to the release the macOS pipeline may already have made; never overwrite an asset.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --repo "$REPO"
          else
            gh release create "$TAG" ./* --repo "$REPO" --draft --verify-tag \
              --title "Clio $TAG (Windows, unsigned)" \
              --notes "Unsigned Windows x64 build. Verify downloads against SHA256SUMS-windows.txt. SmartScreen will warn; see docs/releasing.md."
          fi
