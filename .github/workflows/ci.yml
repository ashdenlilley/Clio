name: Clio CI

on:
  push:
    branches: [main, "stage/**"]
  pull_request:
    branches: [main]

concurrency:
  group: clio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify generated project
        run: |
          xcodegen generate
          git diff --exit-code -- Clio.xcodeproj

      - name: Test and build unsigned universal app
        run: scripts/test.sh

      - name: Static analysis
        run: |
          xcodebuild \
            -project Clio.xcodeproj \
            -scheme Clio \
            -configuration Debug \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clio-test-diagnostics
          path: .build/DerivedData/Logs/Test
          if-no-files-found: ignore

