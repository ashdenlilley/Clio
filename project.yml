name: Clio
# Exact-file Powerbox leases and watchers are included through the Clio source tree.

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    revision: 3c6f9523da3a1ec2fd829673e472d95b8097a3b8
  CMark:
    url: https://github.com/swiftlang/swift-cmark.git
    revision: 924936d0427cb25a61169739a7660230bffa6ea6

targets:
  Clio:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Clio
        excludes:
          - Support/Info.plist
          - Support/Clio.entitlements
          - Resources/Fonts
          - Resources/ThirdPartyNotices
      - path: Clio/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Clio/Resources/ThirdPartyNotices
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
      - package: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: olympus.clio.mac
        PRODUCT_NAME: Clio
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Clio/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Clio/Support/Clio.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
  ClioTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ClioTests
    dependencies:
      - target: Clio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: olympus.clio.mac.tests
        PRODUCT_NAME: ClioTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Clio.app/Contents/MacOS/Clio"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"

  ClioUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ClioUITests
    dependencies:
      - target: Clio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: olympus.clio.mac.ui-tests
        PRODUCT_NAME: ClioUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Clio
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"

schemes:
  Clio:
    build:
      targets:
        Clio: all
        ClioTests:
          - test
        ClioUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ClioTests
        - ClioUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
