name: Clio
# Exact-file Powerbox leases and watchers are included through the Clio source tree.

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(DEVELOPER_TEAM_ID)"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    revision: 3c6f9523da3a1ec2fd829673e472d95b8097a3b8
  CMark:
    url: https://github.com/swiftlang/swift-cmark.git
    revision: 924936d0427cb25a61169739a7660230bffa6ea6

targets:
  Clio:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Clio
        excludes:
          - Support/Info.plist
          - Support/Clio.entitlements
          - Resources/Fonts
          - Resources/ThirdPartyNotices
          - Resources/THIRD-PARTY-NOTICES.md
          - Resources/AppIcon.icon
      - path: Clio/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Clio/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Clio/Resources/ThirdPartyNotices
        type: folder
        buildPhase: resources
      - path: Clio/Resources/THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
      - package: Markdown
      - target: ClioMCPBridge
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: olympus.clio.mac
        PRODUCT_NAME: Clio
        MARKETING_VERSION: 0.1.5
        CURRENT_PROJECT_VERSION: 6
        INFOPLIST_FILE: Clio/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Clio/Support/Clio.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx15*]": AppIcon.icon
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx14*]": AppIcon.icon
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
  ClioMCPBridge:
    type: tool
    platform: macOS
    sources:
      - path: ClioMCPBridge/main.swift
    settings:
      base:
        PRODUCT_NAME: ClioMCPBridge
        PRODUCT_BUNDLE_IDENTIFIER: olympus.clio.mac.mcp-bridge
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        CODE_SIGN_ENTITLEMENTS: ClioMCPBridge/ClioMCPBridge.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
  ClioCrashProbe:
    type: tool
    platform: macOS
    sources:
      - path: ClioCrashProbe/main.swift
      - path: ClioCrashProbe/CrashTestDriver.swift
      - path: Clio/Workspace/CrashRecoveryJournal.swift
      - path: Clio/Workspace/AtomicWriteTransaction.swift
      - path: Clio/Workspace/DocumentRevision.swift
      - path: Clio/Contracts/DocumentContracts.swift
      - path: Clio/Contracts/PerformanceContract.swift
    settings:
      base:
        PRODUCT_NAME: ClioCrashProbe
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: ClioCrashProbe/ClioCrashProbe.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
  ClioTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ClioTests
    dependencies:
      - target: Clio
      - target: ClioCrashProbe
        link: false
    postBuildScripts:
      - name: Copy test-only crash probe
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          /bin/cp -p "${BUILT_PRODUCTS_DIR}/ClioCrashProbe" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ClioCrashProbe"
          if [ "${CODE_SIGNING_ALLOWED}" != "NO" ]; then
            /usr/bin/codesign --force --sign - --entitlements "${SRCROOT}/ClioCrashProbe/ClioCrashProbe.entitlements" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ClioCrashProbe"
          fi
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/ClioCrashProbe"
          - "$(SRCROOT)/ClioCrashProbe/ClioCrashProbe.entitlements"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: olympus.clio.mac.tests
        # Test-only copying/re-signing needs temporary codesign files. App
        # Sandbox in the host and inheritance in the helper remain enabled.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: ClioTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Clio.app/Contents/MacOS/Clio"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"

  ClioUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ClioUITests
    dependencies:
      - target: Clio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: olympus.clio.mac.ui-tests
        PRODUCT_NAME: ClioUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Clio
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"

schemes:
  ClioMCPDiagnostics:
    build:
      targets:
        Clio: [test]
        ClioTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      environmentVariables:
        CLIO_UI_TESTING: "1"
      targets:
        - name: ClioTests
          parallelizable: false
          selectedTests:
            - MCPAccessTests
            - MCPProtocolTests
  ClioShutdownDiagnostics:
    build:
      targets:
        Clio: [test]
        ClioUITests: [test]
    test:
      config: Debug
      enableAddressSanitizer: true
      gatherCoverageData: false
      preferredScreenCaptureFormat: screenshots
      targets:
        - name: ClioUITests
          parallelizable: false
          selectedTests:
            - ClioShutdownUITests
  ClioLaunchDiagnostics:
    build:
      targets:
        Clio: [test]
        ClioUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      preferredScreenCaptureFormat: screenshots
      targets:
        - name: ClioUITests
          parallelizable: false
          selectedTests:
            - ClioLaunchUITests/testLaunchReachesForegroundAndEditor
  Clio:
    build:
      targets:
        Clio: all
        ClioTests:
          - test
        ClioUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      environmentVariables:
        CLIO_UI_TESTING: "1"
      targets:
        - ClioTests
        - ClioUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
